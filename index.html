<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Laoshiii</title>

<style>
body{
  background:#C8A2C8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:'Papyrus', cursive;
}

/* Envelope */
.envelope{
  position:relative;
  width:260px;
  height:180px;
  background:#f5deb3;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
}

/* Top flap */
.envelope::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:130px solid transparent;
  border-right:130px solid transparent;
  border-top:90px solid #e6cfa7;
  transform-origin:top;
  transition:0.6s;
}

/* Paper */
.paper{
  position:absolute;
  bottom:-160px;
  left:20px;
  width:220px;
  height:160px;
  background:lightyellow;
  border-radius:10px;
  padding:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.2);
  transition:0.6s;
  text-align:center;
}

/* Open state */
.envelope.open::before{
  transform:rotateX(180deg);
}

.envelope.open .paper{
  bottom:10px;
}
</style>
</head>

<body>

<div class="envelope" onclick="this.classList.toggle('open')">
  <div class="paper">
    <p><strong>Happy Birthday Laoshiii 🎉</strong></p>
    <p>Semoga sentiasa happy, sihat, dan disayangi 🤍</p>
  </div>
</div>

</body>
</html>
