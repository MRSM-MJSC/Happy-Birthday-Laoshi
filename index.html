<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        height: 100vh;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* INTRO SCREEN */
    .intro {
        text-align: center;
        cursor: pointer;
        animation: fadeIn 1s ease;
    }

    .intro img {
        width: 200px;
        animation: bounce 2s infinite;
    }

    .intro h1 {
        margin-top: 15px;
        color: white;
        font-size: 2.2em;
        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* BIRTHDAY CARD */
    .card {
        display: none;
        background: white;
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: pop 0.8s ease;
    }

    .card h2 {
        color: #ff4d6d;
        font-size: 2.3em;
        margin: 0;
    }

    .card p {
        color: #555;
        margin-top: 10px;
    }

    .name {
        font-weight: bold;
        color: #333;
    }

    /* ANIMATIONS */
    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .balloon {
        position: absolute;
        bottom: -100px;
        font-size: 2em;
        animation: float 6s infinite ease-in;
    }

    @keyframes float {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-120vh); opacity: 0; }
    }
</style>
</head>
<body>

<!-- INTRO -->
<div class="intro" id="intro">
    <img src="IMG_7103-removebg-preview.png" alt="Cake">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p style="color:white;">Tap anywhere 👆</p>
</div>

<!-- CARD -->
<div class="card" id="card">
    <h2>Happy Birthday 🎂</h2>
    <p>To <span class="name">[Nama Dia]</span></p>
    <p>Semoga panjang umur, murah rezeki  
    dan sentiasa bahagia ✨</p>
</div>

<script>
    const intro = document.getElementById("intro");
    const card = document.getElementById("card");

    intro.addEventListener("click", () => {
        intro.style.display = "none";
        card.style.display = "block";

        const emojis = ["🎈","🎉","🎂","💖","✨"];
        for(let i = 0; i < 15; i++){
            const b = document.createElement("div");
            b.className = "balloon";
            b.style.left = Math.random() * 100 + "vw";
            b.style.animationDuration = (4 + Math.random() * 4) + "s";
            b.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            document.body.appendChild(b);
        }
    });
</script>

</body>
</html>
