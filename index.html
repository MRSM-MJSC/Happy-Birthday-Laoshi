<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Laoshiii</title>

<style>
.envelope {
  font-size: 40px;
  cursor: pointer;
  background: none;
  border: none;
}

.letter {
  width: 260px;
  background-color: lightyellow;
  padding: 20px;
  border-radius: 12px;
  border: 2px dotted black;
  font-family: 'Papyrus', cursive;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  position: relative;
  top: 0;
  opacity: 0;
  display: none;
}

.showLetter {
  display: block;
  animation: keluarSurat 0.8s ease-out forwards;
}

@keyframes keluarSurat {
  0% {
    top: 20px;
    opacity: 0;
  }
  100% {
    top: -20px;
    opacity: 1;
  }
}
</style>
</head>

<body style="background-color:#C8A2C8;">
<center>

<p style="font-family:'Papyrus', cursive;">
  Tekan sampul surat ni 📩
</p>

<button class="envelope" onclick="openLetter()">✉️</button>

<div id="letter" class="letter">
  Happy Birthday Laoshii 💜  
</div>

<script>
function openLetter() {
  document.getElementById("letter").classList.add("showLetter");
}
</script>

</center>
</body>
</html>
